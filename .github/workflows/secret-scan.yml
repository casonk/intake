name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan — Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks (push and pull request)
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: 8.30.1

      - name: Install Gitleaks CLI
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            # Sunday scans start together. The release CDN then answers some
            # of them with an HTML page, which tar reports as "not in gzip format".
            sleep "$((RANDOM % 240))"
          fi
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl -sS -L --http1.1 --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/gitleaks.tar.gz -w "%{http_code}" "$url" || true)"
            if [ "$http_code" = "200" ] && tar -tzf /tmp/gitleaks.tar.gz >/dev/null 2>&1; then
              tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
              exit 0
            fi
            echo "gitleaks download attempt ${attempt} failed (http ${http_code})"
            rm -f /tmp/gitleaks.tar.gz
            sleep "$((attempt * 20))"
          done
          echo "failed to download gitleaks ${GITLEAKS_VERSION}" >&2
          exit 1

      - name: Run Gitleaks (full history with baseline)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          /tmp/gitleaks detect \
            --redact \
            -v \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=debug \
            --log-opts="--all" \
            --baseline-path .gitleaks-baseline.json

      - name: Upload Gitleaks SARIF
        if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
