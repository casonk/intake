[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intake"
version = "0.1.0"
description = "Process, sort, and aggregate incoming receipt scans into a wholistic overview"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    "Pillow>=10",
    "toml>=0.10",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
ai = [
    "openai>=1.0",
]

[project.scripts]
intake = "intake.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["intake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
