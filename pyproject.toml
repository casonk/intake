[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intake"
version = "0.1.0"
description = "Process, sort, and aggregate incoming receipt scans into a wholistic overview"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pdfplumber>=0.11",
    "pytesseract>=0.3",
    "Pillow>=10",
    "toml>=0.10",
    "Jinja2>=3.1",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "dyno_lab @ git+https://github.com/casonk/dyno-lab.git",
]
ai = [
    "openai>=1.0",
]
secrets = [
    # Install auto-pass from the portfolio sibling repo:
    #   pip install -e ../auto-pass
    # Listed here for documentation; adjust the path for your environment.
]

[project.scripts]
intake = "intake.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line-too-long — handled by formatter
    "B008",   # function-call in default args — too noisy for existing code
    "SIM108", # ternary instead of if/else — too aggressive for readability
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = ["intake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
